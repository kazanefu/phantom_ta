[package]
name = "phantom_ta"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[features]
dynamic_linking = ["bevy/dynamic_linking"]

[dependencies]
bevy = { version = "0.18.1", features = ["mp3"] }
bevy_rapier2d = "0.34.0"
serde ={ version = "1.0", features = ["derive"] }
ron = "0.12.2"
anyhow = "1.0"
bevy_hanabi = { version = "0.18.0", default-features = false, features = ["2d"]}
toml = "1.1.2"
smallvec = "1.15.2"
bitflags = "2.13.0"
directories = "6.0.0"
